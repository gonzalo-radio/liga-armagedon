site_name: Liga de Warhammer 40,000 — Warmaster
site_description: Reglamento para liga narrativa de Warhammer 40,000 basada en Dominatus (11.ª edición) — Documentación Warmaster
site_author: Liga de Warhammer 40,000
site_url: http://localhost:8001/
docs_dir: docs_src
theme:
  name: material
  custom_dir: overrides/
  palette:
    primary: black
    accent: red
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra:
  version: "v0.9.0 — Warmaster"

extra_css:
  - style/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Inicio: docs/index.md
  - 01 — Introducción: docs/01-introduccion.md
  - 02 — La Campaña: docs/02-campaña.md
  - 03 — Dominatus: docs/03-dominatus.md
  - 04 — Construcción de listas: docs/04-construccion-listas.md
  - 05 — Emparejamientos: docs/05-emparejamientos.md
  - 06 — Puntuación: docs/06-puntuacion.md
  - 07 — Organización: docs/07-organizacion.md
  - 08 — Anexos: docs/08-anexos.md
  - 09 — Release Notes: docs/09-release-notes.md
  - Lore:
    - docs/lore/index.md
    - docs/lore/planeta-caleyat.md
  - Warmaster:
    - warmaster/index.md
    - warmaster/vorago.md
    - warmaster/misiones.md
    - warmaster/release-notes.md
    - warmaster/planes-futuros.md
