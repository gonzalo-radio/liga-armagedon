site_name: Liga de Warhammer 40,000 — Warmaster
site_description: Reglamento para liga narrativa de Warhammer 40,000 basada en Dominatus (11.ª edición) — Documentación Warmaster
site_author: Liga de Warhammer 40,000
site_url: http://localhost:8001/
docs_dir: docs_src
theme:
  name: material
  custom_dir: overrides/
  palette:
    primary: black
    accent: red
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra:
  version: "v0.10.0 — Warmaster"

extra_css:
  - style/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Inicio: docs/index.md
  - Lore:
      - Introducción: docs/lore/introduccion.md
      - Sistema Caleyat: docs/lore/planeta-caleyat.md
      - Facciones: docs/lore/facciones.md
  - Narrativa:
      - Cronología: docs/narrativa/cronologia.md
  - Organización de la campaña:
      - La Campaña: docs/campana/campaña.md
      - Emparejamientos: docs/campana/emparejamientos.md
      - Puntuación: docs/campana/puntuacion.md
      - Organización: docs/campana/organizacion.md
      - Anexos: docs/campana/anexos.md
  - Reglas:
      - Dominatus: docs/reglas/dominatus.md
      - Construcción de listas: docs/reglas/construccion-listas.md
      - Boarding Actions: docs/reglas/boarding-actions.md
  - Referencia:
      - Release Notes: docs/release-notes.md
  - Warmaster:
      - warmaster/index.md
      - warmaster/campana.md
      - warmaster/vorago.md
      - warmaster/misiones.md
      - warmaster/release-notes.md
      - warmaster/planes-futuros.md
