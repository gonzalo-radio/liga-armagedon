site_name: Liga de Warhammer 40,000
site_description: Reglamento para liga narrativa de Warhammer 40,000 basada en Dominatus (11.ª edición)
site_author: Liga de Warhammer 40,000
site_url: https://TU_USUARIO.github.io/NOMBRE_DEL_REPO/
theme:
  name: material
  custom_dir: overrides/
  palette:
    primary: black
    accent: red
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra:
  version: "v0.10.0"

extra_css:
  - style/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Lore:
      - Introducción: lore/introduccion.md
      - Sistema Caleyat: lore/planeta-caleyat.md
      - Facciones: lore/facciones.md
  - Narrativa:
      - Cronología: narrativa/cronologia.md
  - Organización de la campaña:
      - La Campaña: campana/campaña.md
      - Emparejamientos: campana/emparejamientos.md
      - Puntuación: campana/puntuacion.md
      - Organización: campana/organizacion.md
      - Anexos: campana/anexos.md
  - Reglas:
      - Dominatus: reglas/dominatus.md
      - Construcción de listas: reglas/construccion-listas.md
      - Boarding Actions: reglas/boarding-actions.md
  - Referencia:
      - Release Notes: release-notes.md
